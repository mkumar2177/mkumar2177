<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBF3E8"/><stop offset="1" stop-color="#EBD5BA"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8A27A"/><stop offset="1" stop-color="#8B5E3C"/></linearGradient>
  </defs>
  <rect width="900" height="420" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="418" rx="17" fill="none" stroke="#C8A27A" stroke-width="2"/>

  <g fill="none" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round" stroke="#A67B5B">
    <path id="p1" d="M450 150 C450 190 150 180 150 235"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1s" repeatCount="indefinite"/></path>
    <path id="p2" d="M450 150 L450 235"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1s" repeatCount="indefinite"/></path>
    <path id="p3" d="M450 150 C450 190 750 180 750 235"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#6B4226">
    <circle r="5"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2.6s" begin="0.8s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  </g>

  <!-- core -->
  <circle cx="450" cy="92" r="70" fill="none" stroke="#C8A27A" stroke-width="2" stroke-dasharray="4 8">
    <animateTransform attributeName="transform" type="rotate" values="0 450 92;360 450 92" dur="14s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="92" r="58" fill="none" stroke="#A67B5B" stroke-opacity="0.5">
    <animate attributeName="r" values="52;68;52" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/></circle>
  <circle r="4" fill="#4A2E1A"><animateMotion dur="5s" repeatCount="indefinite" path="M450 92 m-70 0 a70 70 0 1 0 140 0 a70 70 0 1 0 -140 0"/></circle>
  <circle r="3" fill="#A67B5B"><animateMotion dur="7s" repeatCount="indefinite" path="M450 92 m70 0 a70 70 0 1 1 -140 0 a70 70 0 1 1 140 0"/></circle>
  <circle cx="450" cy="92" r="48" fill="url(#core)"><animate attributeName="r" values="46;50;46" dur="3s" repeatCount="indefinite"/></circle>
  <text x="450" y="88" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">B.Tech IT</text>
  <text x="450" y="108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#FBF3E8">2023 – 27</text>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <!-- card 1 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 24;0 0" dur="0.8s" begin="0.3s" fill="freeze"/>
      <rect x="30" y="235" width="240" height="160" rx="16" fill="#FFFAF3" stroke="#C8A27A" stroke-width="2"/>
      <rect x="30" y="235" width="240" height="40" rx="16" fill="#C8A27A"/><rect x="30" y="255" width="240" height="20" fill="#C8A27A"/>
      <text x="150" y="261" font-size="16" font-weight="800" fill="#4A2E1A">🎯  FOCUS</text>
      <g font-size="13" font-weight="600" fill="#4A2E1A">
        <rect x="55" y="290" width="190" height="26" rx="13" fill="#EBD5BA"/><text x="150" y="308">Machine Learning</text>
        <rect x="55" y="324" width="190" height="26" rx="13" fill="#EBD5BA"/><text x="150" y="342">Data Analytics</text>
        <rect x="55" y="358" width="190" height="26" rx="13" fill="#EBD5BA"/><text x="150" y="376">Full-Stack Development</text>
      </g>
    </g>
    <!-- card 2 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 24;0 0" dur="0.8s" begin="0.6s" fill="freeze"/>
      <rect x="330" y="235" width="240" height="160" rx="16" fill="#FFFAF3" stroke="#A67B5B" stroke-width="2"/>
      <rect x="330" y="235" width="240" height="40" rx="16" fill="#A67B5B"/><rect x="330" y="255" width="240" height="20" fill="#A67B5B"/>
      <text x="450" y="261" font-size="16" font-weight="800" fill="#FFFFFF">📚  CURRENTLY</text>
      <g font-size="13" font-weight="600" fill="#4A2E1A">
        <rect x="355" y="290" width="190" height="26" rx="13" fill="#EBD5BA"/><text x="450" y="308">Strengthening DSA</text>
        <rect x="355" y="324" width="190" height="26" rx="13" fill="#EBD5BA"/><text x="450" y="342">Data Science</text>
        <text x="450" y="372" font-size="12" fill="#8B5E3C">alongside 5th semester</text>
      </g>
      <rect x="370" y="380" width="160" height="5" rx="2.5" fill="#EBD5BA"/>
      <rect x="370" y="380" width="0" height="5" rx="2.5" fill="#8B5E3C"><animate attributeName="width" values="0;160;160;0" keyTimes="0;0.6;0.9;1" dur="5s" repeatCount="indefinite"/></rect>
    </g>
    <!-- card 3 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 24;0 0" dur="0.8s" begin="0.9s" fill="freeze"/>
      <rect x="630" y="235" width="240" height="160" rx="16" fill="#FFFAF3" stroke="#8B5E3C" stroke-width="2"/>
      <rect x="630" y="235" width="240" height="40" rx="16" fill="#8B5E3C"/><rect x="630" y="255" width="240" height="20" fill="#8B5E3C"/>
      <text x="750" y="261" font-size="16" font-weight="800" fill="#FFFFFF">🚀  LOOKING FOR</text>
      <g font-size="13" font-weight="600" fill="#4A2E1A">
        <rect x="655" y="290" width="190" height="26" rx="13" fill="#EBD5BA"/><text x="750" y="308">ML Internships</text>
        <rect x="655" y="324" width="190" height="26" rx="13" fill="#EBD5BA"/><text x="750" y="342">Data Analyst Roles</text>
        <rect x="655" y="358" width="190" height="26" rx="13" fill="#EBD5BA"/><text x="750" y="376">Freelance Projects</text>
      </g>
    </g>
  </g>
</svg>
